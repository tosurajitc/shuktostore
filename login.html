<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<link rel="icon" type="image/png" href="/favicon.png" />
<title>Admin Login — Shukto Press</title>
<meta name="robots" content="noindex,nofollow"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',system-ui,sans-serif;background:#0A0E13;color:#E8E4DC;-webkit-font-smoothing:antialiased}

body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem;}

.card{
  width:100%;max-width:400px;
  background:#12181F;
  border:1px solid rgba(255,255,255,0.08);
  border-radius:1.25rem;
  padding:2.5rem 2rem;
  box-shadow:0 32px 64px rgba(0,0,0,0.5);
}

.logo{
  font-family:'Syne',sans-serif;
  font-weight:800;
  font-size:1.375rem;
  letter-spacing:-0.03em;
  color:#F8F5EF;
  margin-bottom:0.375rem;
}
.logo-sub{
  font-size:0.8125rem;
  color:rgba(248,245,239,0.4);
  margin-bottom:2rem;
}

h1{
  font-family:'Syne',sans-serif;
  font-size:1.25rem;
  font-weight:700;
  color:#F8F5EF;
  margin-bottom:0.25rem;
  letter-spacing:-0.02em;
}
.subtitle{
  font-size:0.8125rem;
  color:rgba(248,245,239,0.45);
  margin-bottom:1.75rem;
}

.field{display:flex;flex-direction:column;gap:0.375rem;margin-bottom:1rem;}
label{font-size:0.8125rem;font-weight:600;color:rgba(248,245,239,0.6);}
input[type=text],input[type=password]{
  width:100%;
  padding:0.75rem 1rem;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:0.625rem;
  color:#F8F5EF;
  font-size:0.9375rem;
  font-family:inherit;
  outline:none;
  transition:border-color 150ms,box-shadow 150ms;
}
input:focus{
  border-color:rgba(184,135,75,0.6);
  box-shadow:0 0 0 3px rgba(184,135,75,0.12);
}

.btn{
  width:100%;
  margin-top:0.5rem;
  padding:0.875rem 1.5rem;
  background:#E8541A;
  color:white;
  border:none;
  border-radius:9999px;
  font-family:inherit;
  font-size:1rem;
  font-weight:700;
  cursor:pointer;
  transition:filter 150ms,transform 150ms;
}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn:disabled{opacity:0.55;cursor:not-allowed;transform:none;}

.error{
  display:none;
  background:rgba(239,68,68,0.12);
  border:1px solid rgba(239,68,68,0.3);
  border-radius:0.5rem;
  padding:0.75rem 1rem;
  font-size:0.875rem;
  color:#FCA5A5;
  margin-bottom:1rem;
}
.error.visible{display:block;}

.spinner{
  display:inline-block;
  width:16px;height:16px;
  border:2px solid rgba(255,255,255,0.3);
  border-top-color:white;
  border-radius:50%;
  animation:spin 0.7s linear infinite;
  vertical-align:middle;
  margin-right:6px;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="card">
  <div class="logo">Shukto Press</div>
  <div class="logo-sub">Admin Panel</div>

  <h1>Sign in</h1>
  <p class="subtitle">Enter your admin credentials to continue.</p>

  <div class="error" id="error-msg" role="alert"></div>

  <form id="login-form" novalidate>
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username"
             autocomplete="username" autocapitalize="none"
             spellcheck="false" required/>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password"
             autocomplete="current-password" required/>
    </div>
    <button type="submit" class="btn" id="submit-btn">Sign in →</button>
  </form>
</div>

<script>
const form      = document.getElementById('login-form');
const errorBox  = document.getElementById('error-msg');
const submitBtn = document.getElementById('submit-btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  if (!username || !password) {
    showError('Please enter your username and password.');
    return;
  }

  setLoading(true);
  hideError();

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });

    const data = await res.json();

    if (res.ok) {
      // Redirect to admin panel
      window.location.replace('/admin');
    } else {
      showError(data.error || 'Invalid credentials. Please try again.');
    }
  } catch (err) {
    showError('Could not reach the server. Please try again.');
  } finally {
    setLoading(false);
  }
});

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.classList.add('visible');
}
function hideError() {
  errorBox.classList.remove('visible');
}
function setLoading(on) {
  submitBtn.disabled = on;
  submitBtn.innerHTML = on
    ? '<span class="spinner"></span>Signing in…'
    : 'Sign in →';
}
</script>
</body>
</html>
